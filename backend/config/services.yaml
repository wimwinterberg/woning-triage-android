# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    app.tree_dir: '%kernel.project_dir%/config/trees'
    app.prompt_version: 'conversation-v5'
    app.live_model: 'gpt-live-1'
    env(OPENAI_API_KEY): ''
    env(WCS_ADDRESS_API_KEY): ''
    env(ADDRESS_PROVIDER): 'wcs'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Tree\TreeRepository:
        arguments:
            $treeDirectory: '%app.tree_dir%'

    App\Command\ValidateTreeCommand:
        arguments:
            $treeDirectory: '%app.tree_dir%'

    App\Command\ReleaseCommand:
        arguments:
            $treeDirectory: '%app.tree_dir%'

    App\Service\IntakeService:
        arguments:
            $promptVersion: '%app.prompt_version%'

    App\Live\HttpGptLiveClient:
        arguments:
            $apiKey: '%env(default::OPENAI_API_KEY)%'
            $model: '%app.live_model%'

    App\Live\GptLiveClient:
        factory: ['App\Live\GptLiveClientFactory', 'create']
        arguments:
            $http: '@App\Live\HttpGptLiveClient'
            $fake: '@App\Live\FakeGptLiveClient'
            $apiKey: '%env(default::OPENAI_API_KEY)%'

    App\Command\LiveGatewayCommand:
        arguments:
            $apiKey: '%env(default::OPENAI_API_KEY)%'

    App\Analyzer\IntakeAnalyzer: '@App\Analyzer\HeuristicIntakeAnalyzer'
    App\Address\FakeAddressProvider:
        public: true
    App\Address\WcsAddressProvider:
        arguments:
            $apiKey: '%env(default::WCS_ADDRESS_API_KEY)%'
    App\Address\AddressProvider:
        factory: ['App\Address\AddressProviderFactory', 'create']
        arguments:
            $wcs: '@App\Address\WcsAddressProvider'
            $pdok: '@App\Address\PdokAddressProvider'
            $fake: '@App\Address\FakeAddressProvider'
            $name: '%env(default::ADDRESS_PROVIDER)%'

when@test:
    services:
        App\Live\GptLiveClient: '@App\Live\FakeGptLiveClient'
        App\Address\AddressProvider: '@App\Address\FakeAddressProvider'
